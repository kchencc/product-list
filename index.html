<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國代購商品列表</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        th:nth-child(2), td:nth-child(2) {
            display: none;
        }
    </style>
</head>
<body>
    <h1>美國代購商品</h1>

    <label for="exchangeRate">台幣匯率：</label>
    <input type="number" id="exchangeRate" value="34" step="0.1">
    <button onclick="convertPrices()">更新價格</button>

    <h2>Trader Joe's 商品</h2>
    <table border="1">
        <thead>
            <tr>
                <th>項目</th>
                <th>單價（美金）</th>
                <th>單價（台幣）</th>
            </tr>
        </thead>
        <tbody id="traderJoesTable"></tbody>
    </table>

    <h2>Costco 商品</h2>
    <table border="1">
        <thead>
            <tr>
                <th>項目</th>
                <th>單價（美金）</th>
                <th>單價（台幣）</th>
            </tr>
        </thead>
        <tbody id="costcoTable"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
